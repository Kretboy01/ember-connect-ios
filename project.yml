name: EmberConnectMobile
options:
  bundleIdPrefix: com.emberwave
targets:
  EmberConnectMobile:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - App
      - Runtime
      - Shared
    settings:
      GENERATE_INFOPLIST_FILE: "YES"
      # Reuses the already-registered com.vix.emberwave App ID rather than
      # burning one of the ten a free account gets per rolling 7 days.
      # isideload rewrites this to com.vix.emberwave.<TEAMID> at sign time.
      PRODUCT_BUNDLE_IDENTIFIER: com.vix.emberwave
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      ENABLE_BITCODE: "NO"
      SWIFT_VERSION: "5.0"
      GCC_PRECOMPILE_PREFIX_HEADER: "YES"
      SWIFT_OBJC_BRIDGING_HEADER: "App/Bridging-Header.h"
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
      INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
      INFOPLIST_KEY_UIFileSharingEnabled: "YES"
      # The broadcast extension listens for the desktop over USB/Wi-Fi.
      INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Ember Connect streams this device's screen to the desktop app over USB or your local network."
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: ZIPFoundation
      # Embeds the extension in the app bundle so sideloading one installs both.
      - target: EmberConnectBroadcast

  EmberConnectBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Broadcast
      - Shared
    settings:
      GENERATE_INFOPLIST_FILE: "NO"
      INFOPLIST_FILE: Broadcast/Info.plist
      # Must be a prefix-extension of the host app's id — isideload rejects an
      # extension whose id does not start with the main bundle id.
      PRODUCT_BUNDLE_IDENTIFIER: com.vix.emberwave.Broadcast
      PRODUCT_NAME: EmberConnectBroadcast
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      ENABLE_BITCODE: "NO"
      SWIFT_VERSION: "5.0"
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
