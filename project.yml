name: EmberConnectExtensions
options:
  bundleIdPrefix: com.emberwave

# The host application is the pinned LiveContainer runtime in
# LiveContainerRuntime/. XcodeGen is used only for Ember Connect's ReplayKit
# extension, which is embedded into the finished host by the CI workflow.
targets:
  EmberConnectBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Broadcast
      - Shared
    settings:
      GENERATE_INFOPLIST_FILE: "NO"
      INFOPLIST_FILE: Broadcast/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.emberwave.EmberConnectMobile.Broadcast
      PRODUCT_NAME: EmberConnectBroadcast
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      ENABLE_BITCODE: "NO"
      SWIFT_VERSION: "5.0"
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
