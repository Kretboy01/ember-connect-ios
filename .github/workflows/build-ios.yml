name: Build Ember Connect Mobile

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate ReplayKit extension project
        run: xcodegen generate

      - name: Build the LiveContainer runtime
        run: |
          xcodebuild clean build \
            -project LiveContainerRuntime/LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath DerivedDataContainer \
            LIVECONTAINER_BUNDLE_IDENTIFIER=com.emberwave.EmberConnectMobile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXCLUDED_ARCHS="armv7"

      - name: Build Ember screen-mirroring extension
        run: |
          xcodebuild clean build \
            -project EmberConnectExtensions.xcodeproj \
            -scheme EmberConnectBroadcast \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath DerivedDataBroadcast \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXCLUDED_ARCHS="armv7"

      - name: Build bundled example tweak
        run: |
          mkdir -p BuiltTweaks
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fblocks \
            -dynamiclib \
            Tweaks/FlappyPractice/FlappyPractice.m \
            -framework Foundation \
            -framework UIKit \
            -framework SpriteKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -install_name @rpath/FlappyPractice.dylib \
            -o BuiltTweaks/FlappyPractice.dylib

          file BuiltTweaks/FlappyPractice.dylib
          xcrun otool -L BuiltTweaks/FlappyPractice.dylib

      - name: Assemble Ember container host
        run: |
          APP="DerivedDataContainer/Build/Products/Release-iphoneos/LiveContainer.app"
          BROADCAST="DerivedDataBroadcast/Build/Products/Release-iphoneos/EmberConnectBroadcast.appex"

          if [ ! -d "$APP" ]; then
            echo "::error::Container host was not built at $APP"
            exit 1
          fi
          if [ ! -d "$BROADCAST" ]; then
            echo "::error::ReplayKit extension was not built at $BROADCAST"
            exit 1
          fi

          # LiveProcess, LaunchAppExtension, and ShareExtension are optional
          # LiveContainer features. Shipping them would consume three more
          # App IDs, so Ember keeps only its ReplayKit mirroring extension.
          rm -rf "$APP/PlugIns" "$APP/Extensions"
          mkdir -p "$APP/PlugIns"
          cp -R "$BROADCAST" "$APP/PlugIns/"
          mkdir -p "$APP/EmberTweaks"
          cp BuiltTweaks/FlappyPractice.dylib "$APP/EmberTweaks/"

      - name: Verify container, branding, and App ID usage
        run: |
          APP="DerivedDataContainer/Build/Products/Release-iphoneos/LiveContainer.app"
          INFO="$APP/Info.plist"

          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$INFO")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO")
          FILE_SHARING=$(/usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$INFO")
          EXTENSION_COUNT=$(find "$APP/PlugIns" -mindepth 1 -maxdepth 1 -type d -name '*.appex' | wc -l | tr -d ' ')

          test "$DISPLAY_NAME" = "Ember Connect Mobile"
          test "$BUNDLE_ID" = "com.emberwave.EmberConnectMobile"
          test "$FILE_SHARING" = "true"
          test "$EXTENSION_COUNT" = "1"
          test -d "$APP/PlugIns/EmberConnectBroadcast.appex"
          test -f "$APP/Frameworks/LiveContainerSwiftUI.framework/LiveContainerSwiftUI"
          test -f "$APP/Frameworks/ZSign.dylib"
          test -f "$APP/EmberTweaks/FlappyPractice.dylib"

          echo "Verified Ember Connect host with one ReplayKit extension."

      - name: Package IPA
        run: |
          APP="DerivedDataContainer/Build/Products/Release-iphoneos/LiveContainer.app"
          mkdir -p Payload
          cp -R "$APP" Payload/EmberConnectMobile.app
          zip -qry EmberConnectMobile.ipa Payload
          echo "IPA size: $(du -h EmberConnectMobile.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmberConnectMobile
          path: |
            EmberConnectMobile.ipa
            BuiltTweaks/FlappyPractice.dylib
