name: Build Ember Connect Mobile

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test guards with address and undefined-behavior sanitizers
        run: |
          cc -std=c17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/fortnite_guards.c -o /tmp/ember-fortnite-guards
          timeout 30 /tmp/ember-fortnite-guards

  build:
    needs: guard-tests
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test Fortnite compatibility guards
        timeout-minutes: 3
        run: |
          python3 -u - <<'PY'
          import subprocess
          print("Compiling guard tests", flush=True)
          subprocess.run(["xcrun", "clang", "-std=c17", "-Wall", "-Wextra", "-Werror",
                          "tests/fortnite_guards.c",
                          "-o", "/tmp/ember-fortnite-guards"], check=True, timeout=90)
          print("Running guard tests", flush=True)
          subprocess.run(["/tmp/ember-fortnite-guards"], check=True, timeout=30)
          PY

      - name: Generate ReplayKit extension project
        run: xcodegen generate

      - name: Build the LiveContainer runtime
        run: |
          xcodebuild clean build \
            -project LiveContainerRuntime/LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath DerivedDataContainer \
            LIVECONTAINER_BUNDLE_IDENTIFIER=com.emberwave.EmberConnectMobile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXCLUDED_ARCHS="armv7"

      - name: Build Ember screen-mirroring extension
        run: |
          xcodebuild clean build \
            -project EmberConnectExtensions.xcodeproj \
            -scheme EmberConnectBroadcast \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath DerivedDataBroadcast \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXCLUDED_ARCHS="armv7"

      - name: Build bundled tweaks
        run: |
          mkdir -p BuiltTweaks

          # FlappyPractice — SpriteKit mod for Brandon Plank's Flappy Bird
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fblocks \
            -dynamiclib \
            Tweaks/FlappyPractice/FlappyPractice.m \
            -framework Foundation \
            -framework UIKit \
            -framework SpriteKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -install_name @rpath/FlappyPractice.dylib \
            -o BuiltTweaks/FlappyPractice.dylib

          file BuiltTweaks/FlappyPractice.dylib
          xcrun otool -L BuiltTweaks/FlappyPractice.dylib

          # EightBPOfflineLines — native 8 Ball Pool aim-range extension, offline guarded
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fblocks \
            -dynamiclib \
            Tweaks/EightBPOfflineLines/EightBPOfflineLines.m \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -install_name @rpath/EightBPOfflineLines.dylib \
            -o BuiltTweaks/EightBPOfflineLines.dylib

          file BuiltTweaks/EightBPOfflineLines.dylib
          xcrun otool -L BuiltTweaks/EightBPOfflineLines.dylib

          # GettingOverIt — Unity/IL2CPP mod for Getting Over It with Bennett Foddy
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fblocks \
            -dynamiclib \
            Tweaks/Shared/EmberMenu.m \
            Tweaks/GettingOverIt/GettingOverIt.m \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -install_name @rpath/GettingOverIt.dylib \
            -o BuiltTweaks/GettingOverIt.dylib

          file BuiltTweaks/GettingOverIt.dylib
          xcrun otool -L BuiltTweaks/GettingOverIt.dylib

          # Subnautica — IL2CPP mod for Subnautica. Drives the game's own
          # developer console (DevConsole.SendConsoleCommand) plus icalls.
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fblocks \
            -dynamiclib \
            Tweaks/Shared/EmberMenu.m \
            Tweaks/Subnautica/Subnautica.m \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -install_name @rpath/Subnautica.dylib \
            -o BuiltTweaks/Subnautica.dylib

          file BuiltTweaks/Subnautica.dylib
          xcrun otool -L BuiltTweaks/Subnautica.dylib

          # Clover Pit — IL2CPP practice controls using verified GameplayData
          # and SlotMachineScript methods from the installed iOS build.
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fblocks \
            -dynamiclib \
            Tweaks/Shared/EmberMenu.m \
            Tweaks/CloverPit/CloverPit.m \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -install_name @rpath/CloverPit.dylib \
            -o BuiltTweaks/CloverPit.dylib

          file BuiltTweaks/CloverPit.dylib
          xcrun otool -L BuiltTweaks/CloverPit.dylib

          # EmberFortnite — read-only UE4 player-dot overlay for Fortnite 42.10.
          # No IL2CPP, no function calls: pure pointer chain reads + UIKit draw.
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fblocks \
            -dynamiclib \
            Tweaks/Fortnite/EmberFortnite.m \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -framework CommonCrypto \
            -install_name @rpath/EmberFortnite.dylib \
            -o BuiltTweaks/EmberFortnite.dylib

          file BuiltTweaks/EmberFortnite.dylib
          xcrun otool -L BuiltTweaks/EmberFortnite.dylib

      - name: Assemble Ember container host
        run: |
          APP="DerivedDataContainer/Build/Products/Release-iphoneos/LiveContainer.app"
          BROADCAST="DerivedDataBroadcast/Build/Products/Release-iphoneos/EmberConnectBroadcast.appex"

          if [ ! -d "$APP" ]; then
            echo "::error::Container host was not built at $APP"
            exit 1
          fi
          if [ ! -d "$BROADCAST" ]; then
            echo "::error::ReplayKit extension was not built at $BROADCAST"
            exit 1
          fi

          # LiveProcess, LaunchAppExtension, and ShareExtension are optional
          # LiveContainer features. Shipping them would consume three more
          # App IDs, so Ember keeps only its ReplayKit mirroring extension.
          rm -rf "$APP/PlugIns" "$APP/Extensions"
          mkdir -p "$APP/PlugIns"
          cp -R "$BROADCAST" "$APP/PlugIns/"
          mkdir -p "$APP/EmberTweaks"
          cp BuiltTweaks/FlappyPractice.dylib "$APP/EmberTweaks/"
          cp BuiltTweaks/EightBPOfflineLines.dylib "$APP/EmberTweaks/"
          cp BuiltTweaks/GettingOverIt.dylib "$APP/EmberTweaks/"
          cp BuiltTweaks/Subnautica.dylib "$APP/EmberTweaks/"
          cp BuiltTweaks/CloverPit.dylib "$APP/EmberTweaks/"
          cp BuiltTweaks/EmberFortnite.dylib "$APP/EmberTweaks/"

      - name: Verify container, branding, and App ID usage
        run: |
          APP="DerivedDataContainer/Build/Products/Release-iphoneos/LiveContainer.app"
          INFO="$APP/Info.plist"

          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$INFO")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO")
          FILE_SHARING=$(/usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$INFO")
          EXTENSION_COUNT=$(find "$APP/PlugIns" -mindepth 1 -maxdepth 1 -type d -name '*.appex' | wc -l | tr -d ' ')

          test "$DISPLAY_NAME" = "Ember Connect Mobile"
          test "$BUNDLE_ID" = "com.emberwave.EmberConnectMobile"
          test "$FILE_SHARING" = "true"
          test "$EXTENSION_COUNT" = "1"
          test -d "$APP/PlugIns/EmberConnectBroadcast.appex"
          test -f "$APP/Frameworks/LiveContainerSwiftUI.framework/LiveContainerSwiftUI"
          test -f "$APP/Frameworks/ZSign.dylib"
          test -f "$APP/EmberTweaks/FlappyPractice.dylib"
          test -f "$APP/EmberTweaks/EightBPOfflineLines.dylib"
          test -f "$APP/EmberTweaks/GettingOverIt.dylib"
          test -f "$APP/EmberTweaks/Subnautica.dylib"
          test -f "$APP/EmberTweaks/CloverPit.dylib"
          test -f "$APP/EmberTweaks/EmberFortnite.dylib"

          echo "Verified Ember Connect host with one ReplayKit extension."

      - name: Package IPA
        run: |
          APP="DerivedDataContainer/Build/Products/Release-iphoneos/LiveContainer.app"
          mkdir -p Payload
          cp -R "$APP" Payload/EmberConnectMobile.app
          zip -qry EmberConnectMobile.ipa Payload
          echo "IPA size: $(du -h EmberConnectMobile.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmberConnectMobile
          path: |
            EmberConnectMobile.ipa
            BuiltTweaks/FlappyPractice.dylib
            BuiltTweaks/EightBPOfflineLines.dylib
            BuiltTweaks/GettingOverIt.dylib
            BuiltTweaks/Subnautica.dylib
            BuiltTweaks/CloverPit.dylib
            BuiltTweaks/EmberFortnite.dylib
